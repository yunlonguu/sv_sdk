# --- WiFi module: AIC8800D40 (D40L) over SDIO2 ---
CONFIG_AIC_WLAN_AIC8800D40L=y
CONFIG_CHIP_SELECT_AIC8800D40L=y
# WL_REG_ON pin, board specific (sv_board_58x: PB58 / GPIO154, -1 = not used)
CONFIG_AIC_WIRELESS_PWR_GPIO=154
# CONFIG_WIFI_USING_AIC8800MC is not set
# CONFIG_BSP_WIFI_SWT6621 is not set

# This is a WiFi-only example: the board's LCD/panel glue (BSP_LCD_*) lives in
# the product project, so keep the LCD stack out of the example build.
# CONFIG_BSP_USING_LCD is not set
# CONFIG_BSP_USING_LCDC is not set

CONFIG_RT_MAIN_THREAD_STACK_SIZE=8192
CONFIG_FINSH_THREAD_STACK_SIZE=6144
CONFIG_RT_USING_SYSTEM_WORKQUEUE=y
CONFIG_RT_SERIAL_RB_BUFSZ=256
CONFIG_RT_SDIO_THREAD_PRIORITY=9
CONFIG_RT_USING_WIFI=y
CONFIG_RT_USING_PTHREADS=y
# CONFIG_RT_USING_POSIX is not set
CONFIG_RT_USING_NETDEV=y
CONFIG_RT_USING_LWIP=y
CONFIG_RT_USING_LWIP212=y
CONFIG_RT_MEMP_NUM_NETCONN=32
CONFIG_RT_LWIP_PBUF_NUM=60
CONFIG_RT_LWIP_RAW_PCB_NUM=32
CONFIG_RT_LWIP_UDP_PCB_NUM=32
CONFIG_RT_LWIP_TCP_PCB_NUM=32
CONFIG_RT_LWIP_TCP_SEG_NUM=220
CONFIG_RT_LWIP_TCP_SND_BUF=14600
CONFIG_RT_LWIP_TCP_WND=64240
CONFIG_RT_LWIP_TCPTHREAD_PRIORITY=8
CONFIG_RT_LWIP_TCPTHREAD_MBOX_SIZE=32
CONFIG_RT_LWIP_TCPTHREAD_STACKSIZE=4096
CONFIG_RT_LWIP_ETHTHREAD_STACKSIZE=4096
CONFIG_RT_LWIP_ETHTHREAD_MBOX_SIZE=32
CONFIG_RT_LWIP_NETIF_LOOPBACK=y
# DHCP server for the P2P GO group: phone gets an address in 192.168.88.x,
# the board itself is 192.168.88.1 (the AP netif is configured on AP_START).
CONFIG_LWIP_USING_DHCPD=y
CONFIG_DHCPD_SERVER_IP="192.168.88.1"
CONFIG_RT_USING_ULOG=y
CONFIG_PKG_USING_MBEDTLS=y
CONFIG_PKG_USING_FLASHDB=y
